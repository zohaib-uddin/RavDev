# Nginx Configuration for Ravenza
# This file should be placed in /etc/nginx/sites-available/ravenza

server {
    listen 80;
    server_name ravenza.pk www.ravenza.pk;

    # Frontend (React/Vite)
    location / {
        proxy_pass http://localhost:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api/ {
        proxy_pass http://localhost:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeout for long-running requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Email Service Proxy (WebScript)
    # This proxies email requests through Nginx to hide the actual WebScript URL
    location /api/send-email {
        # Replace with your actual WebScript URL
        proxy_pass https://script.google.com/macros/s/YOUR_WEBSCRIPT_ID/exec;
        proxy_http_version 1.1;
        proxy_set_header Host script.google.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Hide the actual WebScript URL from client
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Static files (uploads)
    location /uploads/ {
        alias /var/www/ravenza/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}

